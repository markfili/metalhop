<!doctype html><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Kill-Town Death Fest 2013</title>
<style>
 :root{color-scheme:dark}
 body{background:#111;color:#ddd;font:16px/1.5 system-ui,sans-serif;margin:0;
      padding:16px;max-width:760px;margin-inline:auto}
 h1{font-size:19px;margin:0 0 2px} .sub{color:#777;font-size:13px;margin-bottom:14px}
 #player{position:sticky;top:0;background:#111;padding:8px 0 12px;z-index:2}
 #now{font-size:15px;margin-bottom:6px}
 #now b{color:#fff} #now span{color:#888}
 iframe{width:100%;max-width:400px;height:600px;border:0;display:block}
 .gated{color:#a55;font-style:italic}
 .none{color:#666;padding:24px 0}
 .bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
 button{background:#1c1c1c;color:#ddd;border:1px solid #333;border-radius:4px;
        padding:8px 14px;font:inherit;cursor:pointer}
 button:hover{background:#262626} button:disabled{opacity:.35;cursor:default}
 ol{list-style:none;padding:0;margin:0;border-top:1px solid #222}
 li{display:flex;align-items:center;gap:10px;padding:9px 4px;
    border-bottom:1px solid #222;cursor:pointer}
 li:hover{background:#181818}
 li.on{background:#1e1414;box-shadow:inset 3px 0 0 #c33}
 li.heard .nm{color:#666;text-decoration:line-through}
 .nm{flex:1;min-width:0} .nm b{font-weight:600}
 .cy{color:#777;font-size:12px} .rel{color:#666;font-size:12px;display:block}
 .dead .nm b{color:#665} .tick{color:#555;font-size:15px;width:18px;text-align:center}
 a{color:#c33}
</style>
<h1>Kill-Town Death Fest 2013</h1>
<div class=sub>13 of 24 bands playable - tap a band, tap next when the record ends</div>
<div id=player><div id=now class=none>pick a band below</div></div>
<div class=bar>
 <button id=prev>&larr; prev band</button>
 <button id=next>next band &rarr;</button>
 <button id=stop>stop</button>
 <button id=mark>mark heard</button>
 <button id=unheard>next unheard</button>
</div>
<ol id=list></ol>
<script>
const BANDS = [{"name": "Alchemyst", "country": "Germany", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Anhedonist", "country": "United States", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Apothecary", "country": "Denmark", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Blaspherian", "country": "United States", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Cadaveric Fumes", "country": "France", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1708231172/size=large/tracklist=true/artwork=small/", "release": "Echoing Chambers of Soul", "url": "https://cadavericfumes.bandcamp.com/album/echoing-chambers-of-soul", "note": null, "tracks": 7, "playable": 7, "minutes": 33}, {"name": "Convulse", "country": "Finland", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3291602828/size=large/tracklist=true/artwork=small/", "release": "Cycle of Revenge", "url": "https://convulsefinland.bandcamp.com/album/cycle-of-revenge", "note": null, "tracks": 8, "playable": 8, "minutes": 34}, {"name": "Death Strike", "country": "United States", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Drowned", "country": "Germany", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1401030913/size=large/tracklist=true/artwork=small/", "release": "Procul His", "url": "https://drowned.bandcamp.com/album/procul-his", "note": null, "tracks": 8, "playable": 8, "minutes": 44}, {"name": "Engulfed", "country": "Turkey", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1032285331/size=large/tracklist=true/artwork=small/", "release": "Unearthly Litanies of Despair", "url": "https://engulfed.bandcamp.com/album/unearthly-litanies-of-despair", "note": null, "tracks": 8, "playable": 8, "minutes": 40}, {"name": "Entrails", "country": "Sweden", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1669106708/size=large/tracklist=true/artwork=small/", "release": "Rise of the Reaper", "url": "https://entrails666.bandcamp.com/album/rise-of-the-reaper", "note": null, "tracks": 13, "playable": 13, "minutes": 47}, {"name": "Essenz", "country": "Germany", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=840979417/size=large/tracklist=true/artwork=small/", "release": "Manes Impetus", "url": "https://essenz.bandcamp.com/album/manes-impetus", "note": null, "tracks": 7, "playable": 7, "minutes": 57}, {"name": "Exhumed", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=266755848/size=large/tracklist=true/artwork=small/", "release": "Red Asphalt", "url": "https://exhumed.bandcamp.com/album/red-asphalt", "note": null, "tracks": 10, "playable": 10, "minutes": 37}, {"name": "Funeralium", "country": "France", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1633849921/size=large/tracklist=true/artwork=small/", "release": "Decrepit", "url": "https://funeralium.bandcamp.com/album/decrepit-2", "note": null, "tracks": 4, "playable": 4, "minutes": 78}, {"name": "Indesinence", "country": "United Kingdom", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Into Darkness", "country": "Italy", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2522965408/size=large/tracklist=true/artwork=small/", "release": "\"Route to the Outer Side\" full-length (2026)", "url": "https://intodarkness.bandcamp.com/album/route-to-the-outer-side-full-length-2026", "note": null, "tracks": 8, "playable": 8, "minutes": 41}, {"name": "Katechon", "country": "Norway", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=378662750/size=large/tracklist=true/artwork=small/", "release": "Sanger Fra Auschwitz", "url": "https://katechon.bandcamp.com/album/sanger-fra-auschwitz", "note": null, "tracks": 8, "playable": 8, "minutes": 38}, {"name": "Lantern", "country": "Finland", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Obscure Infinity", "country": "Germany", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Ogdru Jahad", "country": "Denmark", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Ophis", "country": "Germany", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=4023317272/size=large/tracklist=true/artwork=small/", "release": "Spew Forth Odium", "url": "https://ophis.bandcamp.com/album/spew-forth-odium", "note": null, "tracks": 6, "playable": 6, "minutes": 64}, {"name": "Pentacle", "country": "Netherlands", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Reverie", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/track=1191978742/size=large/tracklist=true/artwork=small/", "release": "First Reverie", "url": "https://eirever.bandcamp.com/track/first-reverie", "note": null, "tracks": 1, "playable": 1, "minutes": 3}, {"name": "Rottrevore", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3444429092/size=large/tracklist=true/artwork=small/", "release": "Iniquitous", "url": "https://xtreemmusic.bandcamp.com/album/iniquitous", "note": null, "tracks": 14, "playable": 11, "minutes": 46}, {"name": "Tribulation", "country": "Sweden", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}];
const KEY = 'metalhop:kill-town-death-fest-2013';
let heard = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let cur = -1;

const listEl = document.getElementById('list');
const nowEl  = document.getElementById('now');
const player = document.getElementById('player');

function save(){ localStorage.setItem(KEY, JSON.stringify([...heard])); }

// Bandcamp gates some tracks on some releases; the embed shows them greyed.
// Say so up front so a half-streamable record isn't a surprise mid-listen.
function meta(b){
 if(!b.embed) return 'no Bandcamp listed';
 const bits = [b.release || ''];
 if(b.tracks) bits.push(`${b.tracks} tracks`, `${b.minutes} min`);
 const gated = (b.tracks || 0) - (b.playable || 0);
 let s = bits.filter(Boolean).join(' \u00b7 ');
 if(gated > 0) s += ` \u00b7 <span class=gated>${gated} not streamable</span>`;
 return s;
}

function render(){
 listEl.innerHTML = '';
 BANDS.forEach((b, i) => {
  const li = document.createElement('li');
  li.className = (i === cur ? 'on ' : '') + (heard.has(b.name) ? 'heard ' : '')
               + (b.embed ? '' : 'dead');
  li.innerHTML = `<span class=tick>${heard.has(b.name) ? '&check;' : ''}</span>`
   + `<span class=nm><b>${b.name}</b> <span class=cy>${b.country}</span>`
   + `<span class=rel>${meta(b)}</span></span>`;
  li.onclick = () => play(i);
  listEl.appendChild(li);
 });
}

function play(i){
 const b = BANDS[i];
 if(!b) return;
 cur = i;
 if(b.embed){
  // Only rebuild the iframe when the band actually changes, so re-rendering
  // the list never restarts playback.
  nowEl.className = '';
  nowEl.innerHTML = `<b>${b.name}</b> <span>&mdash; ${meta(b)}</span>`
   + (b.url ? ` <a href="${b.url}" target=_blank rel=noopener>open &rarr;</a>` : '');
  let f = document.getElementById('f');
  if(!f || f.dataset.src !== b.embed){
   if(f) f.remove();
   f = document.createElement('iframe');
   f.id = 'f'; f.dataset.src = b.embed; f.src = b.embed;
   f.setAttribute('seamless','');
   player.appendChild(f);
  }
 } else {
  nowEl.className = 'none';
  nowEl.textContent = b.name + ' \u2014 no Bandcamp listed, nothing to play';
  const f = document.getElementById('f'); if(f) f.remove();
 }
 render();
 listEl.children[i].scrollIntoView({block:'nearest'});
}

function step(d){
 let i = cur;
 for(let n = 0; n < BANDS.length; n++){
  i = (i + d + BANDS.length) % BANDS.length;
  if(BANDS[i].embed){ play(i); return; }
 }
}

document.getElementById('next').onclick = () => step(1);
document.getElementById('prev').onclick = () => step(-1);
// Playback lives inside a cross-origin iframe we cannot command, so "stop"
// means destroying the player. Pause and track-skip are Bandcamp's own
// controls, inside the embed.
document.getElementById('stop').onclick = () => {
 const f = document.getElementById('f');
 if(f) f.remove();
 nowEl.className = 'none';
 nowEl.textContent = cur >= 0 ? 'stopped \u2014 ' + BANDS[cur].name : 'stopped';
};
document.getElementById('mark').onclick = () => {
 if(cur < 0) return;
 const n = BANDS[cur].name;
 heard.has(n) ? heard.delete(n) : heard.add(n);
 save(); render();
};
document.getElementById('unheard').onclick = () => {
 const i = BANDS.findIndex(b => b.embed && !heard.has(b.name));
 if(i >= 0) play(i); else alert('all heard');
};
document.onkeydown = e => {
 if(e.key === 'n') step(1);
 if(e.key === 'p') step(-1);
 if(e.key === 's') document.getElementById('stop').click();
};
render();
</script>
