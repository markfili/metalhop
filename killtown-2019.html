<style>
 :root{color-scheme:dark}
 body{background:#111;color:#ddd;font:16px/1.5 system-ui,sans-serif;margin:0;
      padding:16px;max-width:760px;margin-inline:auto}
 h1{font-size:19px;margin:0 0 2px} .sub{color:#777;font-size:13px;margin-bottom:14px}
 #player{position:sticky;top:0;background:#111;padding:8px 0 12px;z-index:2}
 #now{font-size:15px;margin-bottom:6px}
 #now b{color:#fff} #now span{color:#888}
 iframe{width:100%;max-width:400px;height:600px;border:0;display:block}
 .gated{color:#a55;font-style:italic}
 .none{color:#666;padding:24px 0}
 .bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
 button{background:#1c1c1c;color:#ddd;border:1px solid #333;border-radius:4px;
        padding:8px 14px;font:inherit;cursor:pointer}
 button:hover{background:#262626} button:disabled{opacity:.35;cursor:default}
 ol{list-style:none;padding:0;margin:0}
 /* Cards, not rows: a phone has no hover, so a band has to look tappable
    before the finger arrives. The play glyph carries that on its own. */
 li{display:flex;align-items:center;gap:11px;padding:11px 13px;margin-bottom:8px;
    background:#171717;border:1px solid #2c2c2c;border-radius:7px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .12s,border-color .12s}
 li:hover{background:#1e1e1e;border-color:#444}
 li:active{background:#241717;border-color:#c33}
 li.on{background:#241717;border-color:#c33}
 li.on .play{color:#c33}
 li.heard .nm b{color:#666;text-decoration:line-through}
 .nm{flex:1;min-width:0} .nm b{font-weight:600}
 .cy{color:#777;font-size:12px} .rel{color:#666;font-size:12px;display:block}
 /* Nothing to play is not a tappable thing; say so by looking inert. */
 li.dead{opacity:.5;background:#141414;cursor:default}
 li.dead:hover,li.dead:active{background:#141414;border-color:#2c2c2c}
 .tick{color:#4a4;font-size:15px;width:16px;text-align:center;flex:none}
 .play{color:#777;font-size:14px;flex:none;width:14px;text-align:center}
 a{color:#c33}
</style>
<h1>Kill-Town Death Fest 2019 “The Decompomorphosis”</h1>
<div class=sub>32 of 40 bands playable - tap a band, tap next when the record ends</div>
<div id=player><div id=now class=none>Tap any band below to play it &darr;</div></div>
<div class=bar>
 <button id=prev>&larr; prev band</button>
 <button id=next>next band &rarr;</button>
 <button id=stop>stop</button>
 <button id=mark>mark heard</button>
 <button id=unheard>next unheard</button>
</div>

 0}, {"name": "Kever", "country": "Israel", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1028920695/size=large/tracklist=true/artwork=small/", "release": "Primordial Offerings", "url": "https://kever.bandcamp.com/album/primordial-offerings", "note": null, "tracks": 5, "playable": 5, "minutes": 24}, {"name": "Lucifericon", "country": "Netherlands", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2995301571/size=large/tracklist=true/artwork=small/", "release": "Benediction of the Red Earth", "url": "https://lucifericon.bandcamp.com/album/benediction-of-the-red-earth", "note": null, "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Malthusian", "country": "Ireland", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3759567139/size=large/tracklist=true/artwork=small/", "release": "The Summoning Bell", "url": "https://malthusian.bandcamp.com/album/the-summoning-bell-2", "note": null, "tracks": 8, "playable": 8, "minutes": 54}, {"name": "Mitochondrion", "country": "Canada", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Mortuous", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1353102551/size=large/tracklist=true/artwork=small/", "release": "Upon Desolation", "url": "https://mortuousdeath.bandcamp.com/album/upon-desolation", "note": null, "tracks": 8, "playable": 8, "minutes": 38}, {"name": "Necrovation", "country": "Sweden", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Obliteration", "country": "Norway", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2803246182/size=large/tracklist=true/artwork=small/", "release": "LIVE AT CHAOS DESCENDS MMXIX", "url": "https://obliteration.bandcamp.com/album/live-at-chaos-descends-mmxix", "note": null, "tracks": 8, "playable": 8, "minutes": 48}, {"name": "Of Feather And Bone", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3838040456/size=large/tracklist=true/artwork=small/", "release": "Sulfuric Disintegration", "url": "https://offeatherandbone666.bandcamp.com/album/sulfuric-disintegration", "note": null, "tracks": 6, "playable": 6, "minutes": 30}, {"name": "Phobocosm", "country": "Canada", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3697636593/size=large/tracklist=true/artwork=small/", "release": "Gateway", "url": "https://darkdescentrecords.bandcamp.com/album/gateway", "note": null, "tracks": 7, "playable": 7, "minutes": 35}, {"name": "Profetus", "country": "Finland", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3109243951/size=large/tracklist=true/artwork=small/", "release": "The Sadness of Time Passing", "url": "https://profetus.bandcamp.com/album/the-sadness-of-time-passing-2", "note": null, "tracks": 5, "playable": 5, "minutes": 65}, {"name": "Ritual Necromancy", "country": "United States", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Suffering Hour", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2334176262/size=large/tracklist=true/artwork=small/", "release": "Impelling Rebirth", "url": "https://sufferinghour.bandcamp.com/album/impelling-rebirth", "note": null, "tracks": 5, "playable": 5, "minutes": 15}, {"name": "Superstition", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1823694646/size=large/tracklist=true/artwork=small/", "release": "Surging Throng of Evil's Might", "url": "https://superstitiondeath.bandcamp.com/album/surging-throng-of-evils-might", "note": null, "tracks": 5, "playable": 5, "minutes": 20}, {"name": "Taphos", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1243913610/size=large/tracklist=true/artwork=small/", "release": "Tetralogy of Death", "url": "https://taphos.bandcamp.com/album/tetralogy-of-death", "note": null, "tracks": 1, "playable": 1, "minutes": 4}, {"name": "Tchornobog", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=494919028/size=large/tracklist=true/artwork=small/", "release": "Tchornobog", "url": "https://markovsoroka.bandcamp.com/album/tchornobog", "note": null, "tracks": 4, "playable": 4, "minutes": 64}, {"name": "The Dead Creed", "country": "Greece", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3063298760/size=large/tracklist=true/artwork=small/", "release": "Pieces...To Heal A Soul In The Darkest Hour", "url": "https://thedeadcreed.bandcamp.com/album/pieces-to-heal-a-soul-in-the-darkest-hour", "note": null, "tracks": 8, "playable": 8, "minutes": 52}, {"name": "Tomb Mold", "country": "Canada", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3026181160/size=large/tracklist=true/artwork=small/", "release": "Aperture Of Body", "url": "https://tombmold.bandcamp.com/album/aperture-of-body", "note": null, "tracks": 3, "playable": 3, "minutes": 13}, {"name": "Transgressor", "country": "Japan", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1147173578/size=large/tracklist=true/artwork=small/", "release": "TRANSGRESSOR - Ether For Scapegoat", "url": "https://tanakashoten.bandcamp.com/album/transgressor-ether-for-scapegoat", "note": null, "tracks": 7, "playable": 7, "minutes": 44}, {"name": "Vastum", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1531341944/size=large/tracklist=true/artwork=small/", "release": "Inward to Gethsemane", "url": "https://vastum.bandcamp.com/album/inward-to-gethsemane", "note": null, "tracks": 7, "playable": 7, "minutes": 38}];
const KEY = 'metalhop:kill-town-death-fest-2019-the-decompomorphosis';
let heard = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let cur = -1;

const listEl = document.getElementById('list');
const nowEl  = document.getElementById('now');
const player = document.getElementById('player');

function save(){ localStorage.setItem(KEY, JSON.stringify([...heard])); }

// Bandcamp gates some tracks on some releases; the embed shows them greyed.
// Say so up front so a half-streamable record isn't a surprise mid-listen.
function meta(b){
 if(!b.embed) return 'no Bandcamp listed';
 const bits = [b.release || ''];
 if(b.tracks) bits.push(`${b.tracks} tracks`, `${b.minutes} min`);
 const gated = (b.tracks || 0) - (b.playable || 0);
 let s = bits.filter(Boolean).join(' \u00b7 ');
 if(gated > 0) s += ` \u00b7 <span class=gated>${gated} not streamable</span>`;
 return s;
}

function render(){
 listEl.innerHTML = '';
 BANDS.forEach((b, i) => {
  const li = document.createElement('li');
  li.className = (i === cur ? 'on ' : '') + (heard.has(b.name) ? 'heard ' : '')
               + (b.embed ? '' : 'dead');
  li.innerHTML = `<span class=tick>${heard.has(b.name) ? '&check;' : ''}</span>`
   + `<span class=nm><b>${b.name}</b> <span class=cy>${b.country}</span>`
   + `<span class=rel>${meta(b)}</span></span>`
   // A play glyph only where there is something to play; the embed is
   // cross-origin, so this marks what is selected, never what is sounding.
   + `<span class=play>${b.embed ? '&#9654;' : ''}</span>`;
  li.onclick = () => play(i);
  listEl.appendChild(li);
 });
}

function play(i){
 const b = BANDS[i];
 if(!b) return;
 cur = i;
 if(b.embed){
  // Only rebuild the iframe when the band actually changes, so re-rendering
  // the list never restarts playback.
  nowEl.className = '';
  nowEl.innerHTML = `<b>${b.name}</b> <span>&mdash; ${meta(b)}</span>`
   + (b.url ? ` <a href="${b.url}" target=_blank rel=noopener>open &rarr;</a>` : '');
  let f = document.getElementById('f');
  if(!f || f.dataset.src !== b.embed){
   if(f) f.remove();
   f = document.createElement('iframe');
   f.id = 'f'; f.dataset.src = b.embed; f.src = b.embed;
   f.setAttribute('seamless','');
   player.appendChild(f);
  }
 } else {
  nowEl.className = 'none';
  nowEl.textContent = b.name + ' \u2014 no Bandcamp listed, nothing to play';
  const f = document.getElementById('f'); if(f) f.remove();
 }
 render();
 listEl.children[i].scrollIntoView({block:'nearest'});
}

function step(d){
 let i = cur;
 for(let n = 0; n < BANDS.length; n++){
  i = (i + d + BANDS.length) % BANDS.length;
  if(BANDS[i].embed){ play(i); return; }
 }
}

document.getElementById('next').onclick = () => step(1);
document.getElementById('prev').onclick = () => step(-1);
// Playback lives inside a cross-origin iframe we cannot command, so "stop"
// means destroying the player. Pause and track-skip are Bandcamp's own
// controls, inside the embed.
document.getElementById('stop').onclick = () => {
 const f = document.getElementById('f');
 if(f) f.remove();
 nowEl.className = 'none';
 nowEl.textContent = cur >= 0 ? 'stopped \u2014 ' + BANDS[cur].name : 'stopped';
};
document.getElementById('mark').onclick = () => {
 if(cur < 0) return;
 const n = BANDS[cur].name;
 heard.has(n) ? heard.delete(n) : heard.add(n);
 save(); render();
};
document.getElementById('unheard').onclick = () => {
 const i = BANDS.findIndex(b => b.embed && !heard.has(b.name));
 if(i >= 0) play(i); else alert('all heard');
};
document.onkeydown = e => {
 if(e.key === 'n') step(1);
 if(e.key === 'p') step(-1);
 if(e.key === 's') document.getElementById('stop').click();
};
render();
</script>
