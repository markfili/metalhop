<!doctype html><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Kill-Town Death Fest 2021 “Corona Edition”</title>
<style>
 :root{color-scheme:dark}
 body{background:#111;color:#ddd;font:16px/1.5 system-ui,sans-serif;margin:0;
      padding:16px;max-width:760px;margin-inline:auto}
 h1{font-size:19px;margin:0 0 2px} .sub{color:#777;font-size:13px;margin-bottom:14px}
 #player{position:sticky;top:0;background:#111;padding:8px 0 12px;z-index:2}
 #now{font-size:15px;margin-bottom:6px}
 #now b{color:#fff} #now span{color:#888}
 iframe{width:100%;max-width:400px;height:600px;border:0;display:block}
 .gated{color:#a55;font-style:italic}
 .none{color:#666;padding:24px 0}
 .bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
 button{background:#1c1c1c;color:#ddd;border:1px solid #333;border-radius:4px;
        padding:8px 14px;font:inherit;cursor:pointer}
 button:hover{background:#262626} button:disabled{opacity:.35;cursor:default}
 ol{list-style:none;padding:0;margin:0;border-top:1px solid #222}
 li{display:flex;align-items:center;gap:10px;padding:9px 4px;
    border-bottom:1px solid #222;cursor:pointer}
 li:hover{background:#181818}
 li.on{background:#1e1414;box-shadow:inset 3px 0 0 #c33}
 li.heard .nm{color:#666;text-decoration:line-through}
 .nm{flex:1;min-width:0} .nm b{font-weight:600}
 .cy{color:#777;font-size:12px} .rel{color:#666;font-size:12px;display:block}
 .dead .nm b{color:#665} .tick{color:#555;font-size:15px;width:18px;text-align:center}
 a{color:#c33}
</style>
<h1>Kill-Town Death Fest 2021 “Corona Edition”</h1>
<div class=sub>13 of 13 bands playable - tap a band, tap next when the record ends</div>
<div id=player><div id=now class=none>pick a band below</div></div>
<div class=bar>
 <button id=prev>&larr; prev band</button>
 <button id=next>next band &rarr;</button>
 <button id=stop>stop</button>
 <button id=mark>mark heard</button>
 <button id=unheard>next unheard</button>
</div>
<ol id=list></ol>
<script>
const BANDS = [{"name": "Bastard Grave", "country": "Sweden", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2425808346/size=large/tracklist=true/artwork=small/", "release": "Diorama Of Human Suffering", "url": "https://bastardgrave.bandcamp.com/album/diorama-of-human-suffering", "note": null, "tracks": 9, "playable": 9, "minutes": 38}, {"name": "Chaotian", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/track=1046901957/size=large/tracklist=true/artwork=small/", "release": "Vectors of Pestilence (Circles of Ubiquitous Mutilation)", "url": "https://chaotian.bandcamp.com/track/vectors-of-pestilence-circles-of-ubiquitous-mutilation", "note": null, "tracks": 1, "playable": 1, "minutes": 7}, {"name": "Concrete Winds", "country": "Finland", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3741082001/size=large/tracklist=true/artwork=small/", "release": "Concrete Winds", "url": "https://concretewinds.bandcamp.com/album/concrete-winds", "note": null, "tracks": 9, "playable": 9, "minutes": 25}, {"name": "Dead Void", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1412347064/size=large/tracklist=true/artwork=small/", "release": "Cranial Devastation", "url": "https://deadvoid.bandcamp.com/album/cranial-devastation", "note": null, "tracks": 5, "playable": 5, "minutes": 35}, {"name": "Demilich", "country": "Finland", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=843833116/size=large/tracklist=true/artwork=small/", "release": "20th Adversary Of Emptiness", "url": "https://demilich.bandcamp.com/album/20th-adversary-of-emptiness", "note": null, "tracks": 29, "playable": 29, "minutes": 112}, {"name": "Fuoco Fatuo", "country": "Italy", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2432759025/size=large/tracklist=true/artwork=small/", "release": "Obsidian Katabasis", "url": "https://fuocofatuo.bandcamp.com/album/obsidian-katabasis", "note": null, "tracks": 6, "playable": 6, "minutes": 60}, {"name": "Ghastly", "country": "Finland", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1514183516/size=large/tracklist=true/artwork=small/", "release": "Carrion of Time", "url": "https://ghastly.bandcamp.com/album/carrion-of-time", "note": null, "tracks": 1, "playable": 1, "minutes": 7}, {"name": "Grave Miasma", "country": "United Kingdom", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=580172242/size=large/tracklist=true/artwork=small/", "release": "Abyss of Wrathful Deities", "url": "https://gravemiasma.bandcamp.com/album/abyss-of-wrathful-deities", "note": null, "tracks": 9, "playable": 9, "minutes": 53}, {"name": "Krypts", "country": "Finland", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2813677146/size=large/tracklist=true/artwork=small/", "release": "Unending Degradation", "url": "https://krypts.bandcamp.com/album/unending-degradation", "note": null, "tracks": 8, "playable": 8, "minutes": 39}, {"name": "Septage", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2535379740/size=large/tracklist=true/artwork=small/", "release": "Septic Worship (Intolerant Spree of Infesting Forms)", "url": "https://septage.bandcamp.com/album/septic-worship-intolerant-spree-of-infesting-forms", "note": null, "tracks": 15, "playable": 15, "minutes": 20}, {"name": "Strychnos", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1676517910/size=large/tracklist=true/artwork=small/", "release": "Theodicy of the Seven Mile Scythe (EP)", "url": "https://strychnos.bandcamp.com/album/theodicy-of-the-seven-mile-scythe-ep", "note": null, "tracks": 2, "playable": 2, "minutes": 10}, {"name": "Tardus Mortem", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3209096190/size=large/tracklist=true/artwork=small/", "release": "Reincarnated Through Bloodshed", "url": "https://tardusmortem.bandcamp.com/album/reincarnated-through-bloodshed", "note": null, "tracks": 8, "playable": 8, "minutes": 30}, {"name": "The Funeral Orchestra", "country": "Sweden", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1914641078/size=large/tracklist=true/artwork=small/", "release": "Inexistentia (The Funeral Orchestra & Grave Upheaval Split)", "url": "https://thefuneralorchestra.bandcamp.com/album/inexistentia-the-funeral-orchestra-grave-upheaval-split", "note": null, "tracks": 2, "playable": 2, "minutes": 22}];
const KEY = 'metalhop:kill-town-death-fest-2021-corona-edition';
let heard = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let cur = -1;

const listEl = document.getElementById('list');
const nowEl  = document.getElementById('now');
const player = document.getElementById('player');

function save(){ localStorage.setItem(KEY, JSON.stringify([...heard])); }

// Bandcamp gates some tracks on some releases; the embed shows them greyed.
// Say so up front so a half-streamable record isn't a surprise mid-listen.
function meta(b){
 if(!b.embed) return 'no Bandcamp listed';
 const bits = [b.release || ''];
 if(b.tracks) bits.push(`${b.tracks} tracks`, `${b.minutes} min`);
 const gated = (b.tracks || 0) - (b.playable || 0);
 let s = bits.filter(Boolean).join(' \u00b7 ');
 if(gated > 0) s += ` \u00b7 <span class=gated>${gated} not streamable</span>`;
 return s;
}

function render(){
 listEl.innerHTML = '';
 BANDS.forEach((b, i) => {
  const li = document.createElement('li');
  li.className = (i === cur ? 'on ' : '') + (heard.has(b.name) ? 'heard ' : '')
               + (b.embed ? '' : 'dead');
  li.innerHTML = `<span class=tick>${heard.has(b.name) ? '&check;' : ''}</span>`
   + `<span class=nm><b>${b.name}</b> <span class=cy>${b.country}</span>`
   + `<span class=rel>${meta(b)}</span></span>`;
  li.onclick = () => play(i);
  listEl.appendChild(li);
 });
}

function play(i){
 const b = BANDS[i];
 if(!b) return;
 cur = i;
 if(b.embed){
  // Only rebuild the iframe when the band actually changes, so re-rendering
  // the list never restarts playback.
  nowEl.className = '';
  nowEl.innerHTML = `<b>${b.name}</b> <span>&mdash; ${meta(b)}</span>`
   + (b.url ? ` <a href="${b.url}" target=_blank rel=noopener>open &rarr;</a>` : '');
  let f = document.getElementById('f');
  if(!f || f.dataset.src !== b.embed){
   if(f) f.remove();
   f = document.createElement('iframe');
   f.id = 'f'; f.dataset.src = b.embed; f.src = b.embed;
   f.setAttribute('seamless','');
   player.appendChild(f);
  }
 } else {
  nowEl.className = 'none';
  nowEl.textContent = b.name + ' \u2014 no Bandcamp listed, nothing to play';
  const f = document.getElementById('f'); if(f) f.remove();
 }
 render();
 listEl.children[i].scrollIntoView({block:'nearest'});
}

function step(d){
 let i = cur;
 for(let n = 0; n < BANDS.length; n++){
  i = (i + d + BANDS.length) % BANDS.length;
  if(BANDS[i].embed){ play(i); return; }
 }
}

document.getElementById('next').onclick = () => step(1);
document.getElementById('prev').onclick = () => step(-1);
// Playback lives inside a cross-origin iframe we cannot command, so "stop"
// means destroying the player. Pause and track-skip are Bandcamp's own
// controls, inside the embed.
document.getElementById('stop').onclick = () => {
 const f = document.getElementById('f');
 if(f) f.remove();
 nowEl.className = 'none';
 nowEl.textContent = cur >= 0 ? 'stopped \u2014 ' + BANDS[cur].name : 'stopped';
};
document.getElementById('mark').onclick = () => {
 if(cur < 0) return;
 const n = BANDS[cur].name;
 heard.has(n) ? heard.delete(n) : heard.add(n);
 save(); render();
};
document.getElementById('unheard').onclick = () => {
 const i = BANDS.findIndex(b => b.embed && !heard.has(b.name));
 if(i >= 0) play(i); else alert('all heard');
};
document.onkeydown = e => {
 if(e.key === 'n') step(1);
 if(e.key === 'p') step(-1);
 if(e.key === 's') document.getElementById('stop').click();
};
render();
</script>
