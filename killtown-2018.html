<!doctype html><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Kill-Town Death Fest 2018 “The Resurrection”</title>
<style>
 :root{color-scheme:dark}
 body{background:#111;color:#ddd;font:16px/1.5 system-ui,sans-serif;margin:0;
      padding:16px;max-width:760px;margin-inline:auto}
 h1{font-size:19px;margin:0 0 2px} .sub{color:#777;font-size:13px;margin-bottom:14px}
 #player{position:sticky;top:0;background:#111;padding:8px 0 12px;z-index:2}
 #now{font-size:15px;margin-bottom:6px}
 #now b{color:#fff} #now span{color:#888}
 iframe{width:100%;max-width:400px;height:600px;border:0;display:block}
 .gated{color:#a55;font-style:italic}
 .none{color:#666;padding:24px 0}
 .bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
 button{background:#1c1c1c;color:#ddd;border:1px solid #333;border-radius:4px;
        padding:8px 14px;font:inherit;cursor:pointer}
 button:hover{background:#262626} button:disabled{opacity:.35;cursor:default}
 ol{list-style:none;padding:0;margin:0}
 /* Cards, not rows: a phone has no hover, so a band has to look tappable
    before the finger arrives. The play glyph carries that on its own. */
 li{display:flex;align-items:center;gap:11px;padding:11px 13px;margin-bottom:8px;
    background:#171717;border:1px solid #2c2c2c;border-radius:7px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .12s,border-color .12s}
 li:hover{background:#1e1e1e;border-color:#444}
 li:active{background:#241717;border-color:#c33}
 li.on{background:#241717;border-color:#c33}
 li.on .play{color:#c33}
 li.heard .nm b{color:#666;text-decoration:line-through}
 .nm{flex:1;min-width:0} .nm b{font-weight:600}
 .cy{color:#777;font-size:12px} .rel{color:#666;font-size:12px;display:block}
 /* Nothing to play is not a tappable thing; say so by looking inert. */
 li.dead{opacity:.5;background:#141414;cursor:default}
 li.dead:hover,li.dead:active{background:#141414;border-color:#2c2c2c}
 .tick{color:#4a4;font-size:15px;width:16px;text-align:center;flex:none}
 .play{color:#777;font-size:14px;flex:none;width:14px;text-align:center}
 /* Padded well past the glyph: this is a finger target sitting inside
    another one, so it has to be easy to hit and easy to miss. */
 .like{flex:none;color:#4a4a4a;font-size:17px;line-height:1;padding:6px 2px 6px 8px;
       cursor:pointer;-webkit-tap-highlight-color:transparent}
 .like:hover{color:#c33}
 .like:focus-visible{outline:2px solid #c33;outline-offset:2px;border-radius:3px}
 li.liked .like{color:#c33}
 a{color:#c33}
</style>
<h1>Kill-Town Death Fest 2018 “The Resurrection”</h1>
<div class=sub>25 of 28 bands playable - tap a band, tap next when the record ends</div>
<div id=player><div id=now class=none>Tap any band below to play it &darr;</div></div>
<div class=bar>
 <button id=prev>&larr; prev band</button>
 <button id=next>next band &rarr;</button>
 <button id=stop>stop</button>
 <button id=mark>mark heard</button>
 <button id=unheard>next unheard</button>
 <button id=likebtn>&#9825; like</button>
</div>
<ol id=list></ol>
<script>
const BANDS = [{"name": "Blood Incantation", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3577977696/size=large/tracklist=true/artwork=small/", "release": "All Gates Open (Original Motion Picture Soundtrack) [24-bit HD audio]", "url": "https://bloodincantation.bandcamp.com/album/all-gates-open-original-motion-picture-soundtrack-24-bit-hd-audio", "note": null, "tracks": 4, "playable": 4, "minutes": 61}, {"name": "Cemetery Urn", "country": "Australia", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=83265003/size=large/tracklist=true/artwork=small/", "release": "Cemetery Urn", "url": "https://cemeteryurn.bandcamp.com/album/cemetery-urn", "note": null, "tracks": 10, "playable": 10, "minutes": 41}, {"name": "Deiquisitor", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3295569345/size=large/tracklist=true/artwork=small/", "release": "Deiquisitor Split", "url": "https://deiquisitor.bandcamp.com/album/deiquisitor-split", "note": null, "tracks": 4, "playable": 4, "minutes": 14}, {"name": "Demilich", "country": "Finland", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=843833116/size=large/tracklist=true/artwork=small/", "release": "20th Adversary Of Emptiness", "url": "https://demilich.bandcamp.com/album/20th-adversary-of-emptiness", "note": null, "tracks": 29, "playable": 29, "minutes": 112}, {"name": "Derketa", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1938457611/size=large/tracklist=true/artwork=small/", "release": "In Death We Meet (remix with bonus tracks)", "url": "https://derketa.bandcamp.com/album/in-death-we-meet-remix-with-bonus-tracks", "note": null, "tracks": 10, "playable": 10, "minutes": 59}, {"name": "Fetid", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1321630587/size=large/tracklist=true/artwork=small/", "release": "Sentient Pile of Amorphous Rot", "url": "https://fetid.bandcamp.com/album/sent s": 113}, {"name": "Necrot", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2623516540/size=large/tracklist=true/artwork=small/", "release": "Lifeless Birth", "url": "https://necrot.bandcamp.com/album/lifeless-birth", "note": null, "tracks": 7, "playable": 7, "minutes": 40}, {"name": "Necrowretch", "country": "France", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3502597276/size=large/tracklist=true/artwork=small/", "release": "Swords of Dajjal", "url": "https://necrowretch.bandcamp.com/album/swords-of-dajjal", "note": null, "tracks": 8, "playable": 8, "minutes": 37}, {"name": "Phrenelith", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1727365049/size=large/tracklist=true/artwork=small/", "release": "Ashen Womb", "url": "https://phrenelith.bandcamp.com/album/ashen-womb", "note": null, "tracks": 9, "playable": 9, "minutes": 39}, {"name": "Pissgrave", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2885129097/size=large/tracklist=true/artwork=small/", "release": "Malignant Worthlessness", "url": "https://pissgrave.bandcamp.com/album/malignant-worthlessness", "note": null, "tracks": 9, "playable": 9, "minutes": 31}, {"name": "Reptilian", "country": "Norway", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/track=2803156869/size=large/tracklist=true/artwork=small/", "release": "Huitzilopochtli", "url": "https://reptilianfusa.bandcamp.com/track/huitzilopochtli", "note": null, "tracks": 1, "playable": 1, "minutes": 6}, {"name": "Rippikoulu", "country": "Finland", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=593467452/size=large/tracklist=true/artwork=small/", "release": "Musta seremonia", "url": "https://rippikoulu.bandcamp.com/album/musta-seremonia", "note": null, "tracks": 6, "playable": 6, "minutes": 31}, {"name": "Runemagick", "country": "Sweden", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=145349665/size=large/tracklist=true/artwork=small/", "release": "After Chaos: Nocturnal Vigil", "url": "https://runemagick.bandcamp.com/album/after-chaos-nocturnal-vigil", "note": null, "tracks": 8, "playable": 2, "minutes": 25}, {"name": "Scolex", "country": "United States", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Sempiternal Dusk", "country": "United States", "embed": null, "release": null, "url": null, "note": "no bandcamp listed", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Spectral Voice", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=703091635/size=large/tracklist=true/artwork=small/", "release": "Necrotic Demos", "url": "https://spectralvoice.bandcamp.com/album/necrotic-demos", "note": null, "tracks": 7, "playable": 7, "minutes": 48}, {"name": "Taphos", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1243913610/size=large/tracklist=true/artwork=small/", "release": "Tetralogy of Death", "url": "https://taphos.bandcamp.com/album/tetralogy-of-death", "note": null, "tracks": 1, "playable": 1, "minutes": 4}, {"name": "Torture Rack", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2156342764/size=large/tracklist=true/artwork=small/", "release": "Barbaric Persecution", "url": "https://torturerack.bandcamp.com/album/barbaric-persecution", "note": null, "tracks": 11, "playable": 11, "minutes": 31}, {"name": "Triumvir Foul", "country": "United States", "embed": null, "release": null, "url": null, "note": "HTTPError: 404 Client Error: Not Found for url: https://vrasubatlat.bandcamp.com/music", "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Undergang", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2771124459/size=large/tracklist=true/artwork=small/", "release": "Maddikehavets Dans", "url": "https://undergang.bandcamp.com/album/maddikehavets-dans", "note": null, "tracks": 1, "playable": 1, "minutes": 5}, {"name": "Venenum", "country": "Germany", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1406069448/size=large/tracklist=true/artwork=small/", "release": "Trance Of Death", "url": "https://venenum.bandcamp.com/album/trance-of-death", "note": null, "tracks": 7, "playable": 7, "minutes": 51}, {"name": "Wormridden", "country": "International", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=4117498378/size=large/tracklist=true/artwork=small/", "release": "Festering Glorification", "url": "https://wormridden.bandcamp.com/album/festering-glorification", "note": null, "tracks": 2, "playable": 2, "minutes": 12}];
const KEY = 'metalhop:kill-town-death-fest-2018-the-resurrection';
// Heard is per edition -- you sat through this bill. Liking a band is about
// the band, so it is one shared key across every page here: like Dead Void in
// 2019 and they show liked in 2021 and 2026 too.
const LIKED = 'metalhop:liked';
let heard = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let liked = new Set(JSON.parse(localStorage.getItem(LIKED) || '[]'));
let cur = -1;

const listEl = document.getElementById('list');
const nowEl  = document.getElementById('now');
const player = document.getElementById('player');

function save(){ localStorage.setItem(KEY, JSON.stringify([...heard])); }
// No current band name carries a quote, but the fest books what it books and
// one would silently break the attribute it lands in.
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
                                 .replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function saveLiked(){ localStorage.setItem(LIKED, JSON.stringify([...liked])); }

function toggleLike(name){
 liked.has(name) ? liked.delete(name) : liked.add(name);
 saveLiked();
 render();   // safe mid-playback: render never touches the iframe
}

// Bandcamp gates some tracks on some releases; the embed shows them greyed.
// Say so up front so a half-streamable record isn't a surprise mid-listen.
function meta(b){
 if(!b.embed) return 'no Bandcamp listed';
 const bits = [b.release || ''];
 if(b.tracks) bits.push(`${b.tracks} tracks`, `${b.minutes} min`);
 const gated = (b.tracks || 0) - (b.playable || 0);
 let s = bits.filter(Boolean).join(' \u00b7 ');
 if(gated > 0) s += ` \u00b7 <span class=gated>${gated} not streamable</span>`;
 return s;
}

// The bar's like button reflects whichever band is selected, so it is redrawn
// with the list rather than set once at startup.
function syncLikeBtn(){
 const b = BANDS[cur];
 const on = b && liked.has(b.name);
 const btn = document.getElementById('likebtn');
 btn.innerHTML = on ? '&hearts; liked' : '&#9825; like';
 btn.style.color = on ? '#c33' : '';
 btn.disabled = cur < 0;
}

function render(){
 syncLikeBtn();
 listEl.innerHTML = '';
 BANDS.forEach((b, i) => {
  const li = document.createElement('li');
  li.className = (i === cur ? 'on ' : '') + (heard.has(b.name) ? 'heard ' : '')
               + (liked.has(b.name) ? 'liked ' : '') + (b.embed ? '' : 'dead');
  li.innerHTML = `<span class=tick>${heard.has(b.name) ? '&check;' : ''}</span>`
   + `<span class=nm><b>${b.name}</b> <span class=cy>${b.country}</span>`
   + `<span class=rel>${meta(b)}</span></span>`
   // A play glyph only where there is something to play; the embed is
   // cross-origin, so this marks what is selected, never what is sounding.
   + `<span class=play>${b.embed ? '&#9654;' : ''}</span>`
   + `<span class=like role=button tabindex=0 aria-pressed="${liked.has(b.name)}"`
   + ` aria-label="like ${esc(b.name)}">`
   + `${liked.has(b.name) ? '&hearts;' : '&#9825;'}</span>`;
  li.onclick = () => play(i);
  // The heart sits inside the row, so its click must not also start the band.
  const heart = li.querySelector('.like');
  heart.onclick = e => { e.stopPropagation(); toggleLike(b.name); };
  heart.onkeydown = e => {
   if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault(); e.stopPropagation(); toggleLike(b.name);
   }
  };
  listEl.appendChild(li);
 });
}

function play(i){
 const b = BANDS[i];
 if(!b) return;
 cur = i;
 if(b.embed){
  // Only rebuild the iframe when the band actually changes, so re-rendering
  // the list never restarts playback.
  nowEl.className = '';
  nowEl.innerHTML = `<b>${b.name}</b> <span>&mdash; ${meta(b)}</span>`
   + (b.url ? ` <a href="${b.url}" target=_blank rel=noopener>open &rarr;</a>` : '');
  let f = document.getElementById('f');
  if(!f || f.dataset.src !== b.embed){
   if(f) f.remove();
   f = document.createElement('iframe');
   f.id = 'f'; f.dataset.src = b.embed; f.src = b.embed;
   f.setAttribute('seamless','');
   player.appendChild(f);
  }
 } else {
  nowEl.className = 'none';
  nowEl.textContent = b.name + ' \u2014 no Bandcamp listed, nothing to play';
  const f = document.getElementById('f'); if(f) f.remove();
 }
 render();
 listEl.children[i].scrollIntoView({block:'nearest'});
}

function step(d){
 let i = cur;
 for(let n = 0; n < BANDS.length; n++){
  i = (i + d + BANDS.length) % BANDS.length;
  if(BANDS[i].embed){ play(i); return; }
 }
}

document.getElementById('next').onclick = () => step(1);
document.getElementById('prev').onclick = () => step(-1);
// Playback lives inside a cross-origin iframe we cannot command, so "stop"
// means destroying the player. Pause and track-skip are Bandcamp's own
// controls, inside the embed.
document.getElementById('stop').onclick = () => {
 const f = document.getElementById('f');
 if(f) f.remove();
 nowEl.className = 'none';
 nowEl.textContent = cur >= 0 ? 'stopped \u2014 ' + BANDS[cur].name : 'stopped';
};
document.getElementById('mark').onclick = () => {
 if(cur < 0) return;
 const n = BANDS[cur].name;
 heard.has(n) ? heard.delete(n) : heard.add(n);
 save(); render();
};
document.getElementById('unheard').onclick = () => {
 const i = BANDS.findIndex(b => b.embed && !heard.has(b.name));
 if(i >= 0) play(i); else alert('all heard');
};
document.getElementById('likebtn').onclick = () => {
 if(cur >= 0) toggleLike(BANDS[cur].name);
};
document.onkeydown = e => {
 if(e.target.tagName === 'BUTTON' || e.target.className === 'like') return;
 if(e.key === 'n') step(1);
 if(e.key === 'p') step(-1);
 if(e.key === 's') document.getElementById('stop').click();
 if(e.key === 'l' && cur >= 0) toggleLike(BANDS[cur].name);
};

render();
</script>
