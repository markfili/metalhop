<meta name=viewport content="width=device-width,initial-scale=1">
<title>Kill-Town Death Fest 2023 “The Carrion Cathering”</title>
<style>
 :root{color-scheme:dark}
 body{background:#111;color:#ddd;font:16px/1.5 system-ui,sans-serif;margin:0;
      padding:16px;max-width:760px;margin-inline:auto}
 h1{font-size:19px;margin:0 0 2px} .sub{color:#777;font-size:13px;margin-bottom:14px}
 #player{position:sticky;top:0;background:#111;padding:8px 0 12px;z-index:2}
 #now{font-size:15px;margin-bottom:6px}
 #now b{color:#fff} #now span{color:#888}
 iframe{width:100%;max-width:400px;height:600px;border:0;display:block}
 .gated{color:#a55;font-style:italic}
 .none{color:#666;padding:24px 0}
 .bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
 button{background:#1c1c1c;color:#ddd;border:1px solid #333;border-radius:4px;
        padding:8px 14px;font:inherit;cursor:pointer}
 button:hover{background:#262626} button:disabled{opacity:.35;cursor:default}
 ol{list-style:none;padding:0;margin:0}
 /* Cards, not rows: a phone has no hover, so a band has to look tappable
    before the finger arrives. The play glyph carries that on its own. */
 li{display:flex;align-items:center;gap:11px;padding:11px 13px;margin-bottom:8px;
    background:#171717;border:1px solid #2c2c2c;border-radius:7px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .12s,border-color .12s}
 li:hover{background:#1e1e1e;border-color:#444}
 li:active{background:#241717;border-color:#c33}
 li.on{background:#241717;border-color:#c33}
 li.on .play{color:#c33}
 li.heard .nm b{color:#666;text-decoration:line-through}
 .nm{flex:1;min-width:0} .nm b{font-weight:600}
 .cy{color:#777;font-size:12px} .rel{color:#666;font-size:12px;display:block}
 /* Nothing to play is not a tappable thing; say so by looking inert. */
 li.dead{opacity:.5;background:#141414;cursor:default}
 li.dead:hover,li.dead:active{background:#141414;border-color:#2c2c2c}
 .tick{color:#4a4;font-size:15px;width:16px;text-align:center;flex:none}
 .play{color:#777;font-size:14px;flex:none;width:14px;text-align:center}
 a{color:#c33}
</style>
<h1>Kill-Town Death Fest 2023 “The Carrion Cathering”</h1>
<div class=sub>34 of 37 bands playable - tap a band, tap next when the record ends</div>
<div id=player><div id=now class=none>Tap any band below to play it &darr;</div></div>
<div class=bar>
 <button id=prev>&larr; prev band</button>
 <button id=next>next band &rarr;</button>
 <button id=stop>stop</button>
 <button id=mark>mark heard</button>
 <button id=unheard>next unheard</button>
</div>
<ol id=list></ol>

"embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=740283416/size=large/tracklist=true/artwork=small/", "release": "Leprous Daylight", "url": "https://fossilization.bandcamp.com/album/leprous-daylight", "note": null, "tracks": 8, "playable": 8, "minutes": 37}, {"name": "Fuoco Fatuo", "country": "Italy", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2432759025/size=large/tracklist=true/artwork=small/", "release": "Obsidian Katabasis", "url": "https://fuocofatuo.bandcamp.com/album/obsidian-katabasis", "note": null, "tracks": 6, "playable": 6, "minutes": 60}, {"name": "God Forsaken", "country": "Finland", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3394926876/size=large/tracklist=true/artwork=small/", "release": "Promo 2024", "url": "https://godforsaken2.bandcamp.com/album/promo-2024", "note": null, "tracks": 3, "playable": 3, "minutes": 15}, {"name": "Gosudar", "country": "Russia", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=4083296203/size=large/tracklist=true/artwork=small/", "release": "Egocidal Maze Descent", "url": "https://gosudardeath.bandcamp.com/album/egocidal-maze-descent", "note": null, "tracks": 3, "playable": 3, "minutes": 28}, {"name": "Grave Infestation", "country": "Canada", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=539192934/size=large/tracklist=true/artwork=small/", "release": "Carnage Gathers", "url": "https://graveinfestation.bandcamp.com/album/carnage-gathers", "note": null, "tracks": 8, "playable": 8, "minutes": 40}, {"name": "Gutless", "country": "Australia", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=406863036/size=large/tracklist=true/artwork=small/", "release": "High Impact Violence", "url": "https://gutlessmelbourne.bandcamp.com/album/high-impact-violence", "note": null, "tracks": 8, "playable": 8, "minutes": 26}, {"name": "Of Feather And Bone", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3838040456/size=large/tracklist=true/artwork=small/", "release": "Sulfuric Disintegration", "url": "https://offeatherandbone666.bandcamp.com/album/sulfuric-disintegration", "note": null, "tracks": 6, "playable": 6, "minutes": 30}, {"name": "Ossuary", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3986956227/size=large/tracklist=true/artwork=small/", "release": "Abhorrent Worship", "url": "https://ossuary-death.bandcamp.com/album/abhorrent-worship", "note": null, "tracks": 6, "playable": 6, "minutes": 37}, {"name": "Phobophilic", "country": "United States", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2437329586/size=large/tracklist=true/artwork=small/", "release": "ENVELOPING ABSURDITY", "url": "https://phobophilic.bandcamp.com/album/enveloping-absurdity", "note": null, "tracks": 8, "playable": 8, "minutes": 38}, {"name": "Sedimentum", "country": "Canada", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=3836789919/size=large/tracklist=true/artwork=small/", "release": "Total Isolation // Sedimentum", "url": "https://sedimentum.bandcamp.com/album/total-isolation-sedimentum", "note": null, "tracks": 1, "playable": 1, "minutes": 4}, {"name": "Slimelord", "country": "United Kingdom", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2667915797/size=large/tracklist=true/artwork=small/", "release": "CHYTRIDIOMYCOSIS RELINQUISHED", "url": "https://slimelord.bandcamp.com/album/chytridiomycosis-relinquished", "note": null, "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Strychnos", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1676517910/size=large/tracklist=true/artwork=small/", "release": "Theodicy of the Seven Mile Scythe (EP)", "url": "https://strychnos.bandcamp.com/album/theodicy-of-the-seven-mile-scythe-ep", "note": null, "tracks": 2, "playable": 2, "minutes": 10}, {"name": "Sulphurous", "country": "Denmark", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=844303283/size=large/tracklist=true/artwork=small/", "release": "Sulphurous / Proscription split 7\"", "url": "https://sulphurous.bandcamp.com/album/sulphurous-proscription-split-7", "note": null, "tracks": 0, "playable": 0, "minutes": 0}, {"name": "Teratoma", "country": "Germany", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2545816198/size=large/tracklist=true/artwork=small/", "release": "Longing Voracity", "url": "https://teratomadeathmetal.bandcamp.com/album/longing-voracity", "note": null, "tracks": 10, "playable": 10, "minutes": 46}, {"name": "Transgressor", "country": "Japan", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=1147173578/size=large/tracklist=true/artwork=small/", "release": "TRANSGRESSOR - Ether For Scapegoat", "url": "https://tanakashoten.bandcamp.com/album/transgressor-ether-for-scapegoat", "note": null, "tracks": 7, "playable": 7, "minutes": 44}, {"name": "V. V. V.", "country": "Sweden", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/track=1015355730/size=large/tracklist=true/artwork=small/", "release": "SHAMAN NECROMANCY - ASTRAL PROJECTIONS II", "url": "https://visionaryvexationsvibrations.bandcamp.com/track/shaman-necromancy-astral-projections-ii", "note": "artist mismatch: page says 'Visionary Vexations Vibrations'", "tracks": 1, "playable": 1, "minutes": 10}, {"name": "Vanhelgd", "country": "Sweden", "embed": "https://bandcamp.com/EmbeddedPlayer/v=2/album=2778702449/size=large/tracklist=true/artwork=small/", "release": "Temple Of Phobos", "url": "https://vanhelgd.bandcamp.com/album/temple-of-phobos", "note": null, "tracks": 7, "playable": 7, "minutes": 44}];
const KEY = 'metalhop:kill-town-death-fest-2023-the-carrion-cathering';
let heard = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let cur = -1;

const listEl = document.getElementById('list');
const nowEl  = document.getElementById('now');
const player = document.getElementById('player');

function save(){ localStorage.setItem(KEY, JSON.stringify([...heard])); }

// Bandcamp gates some tracks on some releases; the embed shows them greyed.
// Say so up front so a half-streamable record isn't a surprise mid-listen.
function meta(b){
 if(!b.embed) return 'no Bandcamp listed';
 const bits = [b.release || ''];
 if(b.tracks) bits.push(`${b.tracks} tracks`, `${b.minutes} min`);
 const gated = (b.tracks || 0) - (b.playable || 0);
 let s = bits.filter(Boolean).join(' \u00b7 ');
 if(gated > 0) s += ` \u00b7 <span class=gated>${gated} not streamable</span>`;
 return s;
}

function render(){
 listEl.innerHTML = '';
 BANDS.forEach((b, i) => {
  const li = document.createElement('li');
  li.className = (i === cur ? 'on ' : '') + (heard.has(b.name) ? 'heard ' : '')
               + (b.embed ? '' : 'dead');
  li.innerHTML = `<span class=tick>${heard.has(b.name) ? '&check;' : ''}</span>`
   + `<span class=nm><b>${b.name}</b> <span class=cy>${b.country}</span>`
   + `<span class=rel>${meta(b)}</span></span>`
   // A play glyph only where there is something to play; the embed is
   // cross-origin, so this marks what is selected, never what is sounding.
   + `<span class=play>${b.embed ? '&#9654;' : ''}</span>`;
  li.onclick = () => play(i);
  listEl.appendChild(li);
 });
}

function play(i){
 const b = BANDS[i];
 if(!b) return;
 cur = i;
 if(b.embed){
  // Only rebuild the iframe when the band actually changes, so re-rendering
  // the list never restarts playback.
  nowEl.className = '';
  nowEl.innerHTML = `<b>${b.name}</b> <span>&mdash; ${meta(b)}</span>`
   + (b.url ? ` <a href="${b.url}" target=_blank rel=noopener>open &rarr;</a>` : '');
  let f = document.getElementById('f');
  if(!f || f.dataset.src !== b.embed){
   if(f) f.remove();
   f = document.createElement('iframe');
   f.id = 'f'; f.dataset.src = b.embed; f.src = b.embed;
   f.setAttribute('seamless','');
   player.appendChild(f);
  }
 } else {
  nowEl.className = 'none';
  nowEl.textContent = b.name + ' \u2014 no Bandcamp listed, nothing to play';
  const f = document.getElementById('f'); if(f) f.remove();
 }
 render();
 listEl.children[i].scrollIntoView({block:'nearest'});
}

function step(d){
 let i = cur;
 for(let n = 0; n < BANDS.length; n++){
  i = (i + d + BANDS.length) % BANDS.length;
  if(BANDS[i].embed){ play(i); return; }
 }
}

document.getElementById('next').onclick = () => step(1);
document.getElementById('prev').onclick = () => step(-1);
// Playback lives inside a cross-origin iframe we cannot command, so "stop"
// means destroying the player. Pause and track-skip are Bandcamp's own
// controls, inside the embed.
document.getElementById('stop').onclick = () => {
 const f = document.getElementById('f');
 if(f) f.remove();
 nowEl.className = 'none';
 nowEl.textContent = cur >= 0 ? 'stopped \u2014 ' + BANDS[cur].name : 'stopped';
};
document.getElementById('mark').onclick = () => {
 if(cur < 0) return;
 const n = BANDS[cur].name;
 heard.has(n) ? heard.delete(n) : heard.add(n);
 save(); render();
};
document.getElementById('unheard').onclick = () => {
 const i = BANDS.findIndex(b => b.embed && !heard.has(b.name));
 if(i >= 0) play(i); else alert('all heard');
};
document.onkeydown = e => {
 if(e.key === 'n') step(1);
 if(e.key === 'p') step(-1);
 if(e.key === 's') document.getElementById('stop').click();
};
render();
</script>
